{% include base_path %}

<!-- start custom head snippets -->

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/assets/images/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/assets/images/favicon.png">

<!-- Dark-mode FOUC prevention: apply theme before any CSS renders -->
<script>
  (function () {
    var stored = localStorage.getItem('wz-theme');
    var theme  = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>

<!-- Inter font (professional, modern) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Custom enhancements stylesheet. ?v= is the build time, so a deploy never
     pairs new pages with a stylesheet the browser cached from the last one. -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/custom.css?v={{ site.time | date: '%s' }}">


<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

{% comment %}MathJax (~100 KB, and it re-typesets after load) only on pages with TeX: $…$ or \(…\){% endcomment %}
{% if page.content contains '$' or page.content contains '\(' %}
<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML' async></script>
{% endif %}

<!-- end custom head snippets -->
